name: CI/CD for Flask App (Smart Deploy)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-attendance-app .
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-attendance-app


  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to AWS EC2
        run: |
          echo "${{ secrets.AWS_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << EOF

            echo "🚀 Starting Deployment..."

            # -----------------------------------
            # 1. Setup MySQL (if not exists)
            # -----------------------------------
            if [ "$(docker ps -aq -f name=mysql-db)" ]; then
              echo "✅ MySQL container already exists"
              
              # Start if stopped
              if [ ! "$(docker ps -q -f name=mysql-db)" ]; then
                echo "🔄 Starting existing MySQL container..."
                docker start mysql-db
              fi

            else
              echo "⚙️ MySQL not found. Installing..."

              docker pull mysql:latest

              docker run -d \
                --name mysql-db \
                --restart always \
                -e MYSQL_ROOT_PASSWORD=root \
                -e MYSQL_DATABASE=attendance_db \
                -v mysql_data:/var/lib/mysql \
                -p 3306:3306 \
                mysql:latest

              # Wait until MySQL is ready
              until docker exec mysql-db mysqladmin ping -h "localhost" --silent; do
                echo "⏳ Waiting for MySQL..."
                sleep 5
              done

              echo "✅ MySQL is ready!"
            fi


            # -----------------------------------
            # 2. Deploy Flask App
            # -----------------------------------
            echo "🚀 Deploying Flask App..."

            docker stop flask-app || true
            docker rm flask-app || true

            # Secure login
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/flask-attendance-app

            # Run container
            docker run -d \
              --name flask-app \
              --restart always \
              -p 5000:5000 \
              -e DB_HOST=mysql-db \
              -e DB_USER=root \
              -e DB_PASSWORD=root \
              -e DB_NAME=attendance_db \
              -v flask_data:/app/data \
              ${{ secrets.DOCKER_USERNAME }}/flask-attendance-app

            echo "✅ Deployment Completed Successfully!"

          EOF
          