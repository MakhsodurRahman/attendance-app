{% extends "base.html" %}

{% block title %}Analytics - Attendify{% endblock %}
{% block header %}Attendance Analytics{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
    <!-- Filters Card -->
    <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center">
            <i class="fas fa-filter mr-2 text-indigo-600"></i>
            Data Filters
        </h3>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
                <input type="date" id="startDate" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-3 bg-gray-50 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                <input type="date" id="endDate" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-3 bg-gray-50 border">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Student Name (Optional)</label>
                <input type="text" id="studentName" placeholder="Search by name..."
                    class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-3 bg-gray-50 border">
            </div>
            <button onclick="fetchAnalytics()"
                class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md">
                Generate Report
            </button>
        </div>
    </div>

    <!-- Chart Card -->
    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100 min-h-[400px]">
        <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center">
            <i class="fas fa-chart-pie mr-2 text-indigo-600"></i>
            Distribution Summary
        </h3>
        <div class="relative h-64 flex items-center justify-center">
            <canvas id="attendanceChart"></canvas>
            <div id="noDataMessage" class="hidden absolute inset-0 flex items-center justify-center text-gray-400 font-medium">
                No data available for the selected filters.
            </div>
        </div>
    </div>
</div>

<script>
    let myChart = null;

    document.addEventListener('DOMContentLoaded', () => {
        // Set default dates
        const today = new Date().toISOString().split('T')[0];
        const lastWeek = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
        document.getElementById('startDate').value = lastWeek;
        document.getElementById('endDate').value = today;
        fetchAnalytics();
    });

    function fetchAnalytics() {
        let startDate = document.getElementById("startDate").value;
        let endDate = document.getElementById("endDate").value;
        let studentName = document.getElementById("studentName").value;

        let url = `/attendance_stats?start_date=${startDate}&end_date=${endDate}`;
        if (studentName) {
            url += `&student_name=${studentName}`;
        }

        fetch(url)
            .then(response => response.json())
            .then(data => updateChart(data));
    }

    function updateChart(data) {
        const ctx = document.getElementById("attendanceChart").getContext("2d");
        const noData = data.Present === 0 && data.Absent === 0;

        if (noData) {
            document.getElementById('noDataMessage').classList.remove('hidden');
            if (myChart) myChart.destroy();
            return;
        } else {
            document.getElementById('noDataMessage').classList.add('hidden');
        }

        const chartData = {
            labels: ["Present", "Absent"],
            datasets: [{
                data: [data.Present, data.Absent],
                backgroundColor: ["#10b981", "#ef4444"],
                borderWidth: 0,
                hoverOffset: 10
            }]
        };

        if (myChart) {
            myChart.data = chartData;
            myChart.update();
        } else {
            myChart = new Chart(ctx, {
                type: "doughnut",
                data: chartData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    },
                    cutout: '70%'
                }
            });
        }
    }
</script>
{% endblock %}
