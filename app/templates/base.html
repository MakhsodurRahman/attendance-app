<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>{% block title %}Attendance App{% endblock %}</title>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-indigo-700 text-white w-64 flex-shrink-0 transition-all duration-300">
            <div class="p-6 flex items-center space-x-3">
                <i class="fas fa-user-check text-2xl"></i>
                <span class="text-xl font-bold">Attendify</span>
            </div>
            <nav class="mt-6">
                <a href="/" class="block py-3 px-6 hover:bg-indigo-600 flex items-center space-x-3 {% if request.path == '/' %}bg-indigo-800 border-l-4 border-white{% endif %}">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/students_page" class="block py-3 px-6 hover:bg-indigo-600 flex items-center space-x-3 {% if request.path == '/students_page' %}bg-indigo-800 border-l-4 border-white{% endif %}">
                    <i class="fas fa-users"></i>
                    <span>Students</span>
                </a>
                <a href="/get_attendance" class="block py-3 px-6 hover:bg-indigo-600 flex items-center space-x-3 {% if request.path == '/get_attendance' %}bg-indigo-800 border-l-4 border-white{% endif %}">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Attendance</span>
                </a>
                <a href="/analytics" class="block py-3 px-6 hover:bg-indigo-600 flex items-center space-x-3 {% if request.path == '/analytics' %}bg-indigo-800 border-l-4 border-white{% endif %}">
                    <i class="fas fa-chart-line"></i>
                    <span>Analytics</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-gray-100">
            <!-- Navbar -->
            <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
                <h1 class="text-2xl font-semibold text-gray-800">{% block header %}{% endblock %}</h1>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-600"><i class="far fa-calendar-alt mr-2"></i>{{ now.strftime('%B %d, %Y') if now else '' }}</span>
                </div>
            </header>

            <div class="p-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50"></div>

    <script>
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-lg shadow-lg text-white mb-3 transition-opacity duration-500 ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
