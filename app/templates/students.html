{% extends "base.html" %}

{% block title %}Manage Students - Attendify{% endblock %}
{% block header %}Student Management{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <h3 class="text-lg font-bold text-gray-800">Student List</h3>
        <button onclick="openAddModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition flex items-center">
            <i class="fas fa-plus mr-2"></i> Add Student
        </button>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left">
            <thead class="bg-gray-50 text-gray-500 text-sm uppercase font-semibold">
                <tr>
                    <th class="px-6 py-4">ID</th>
                    <th class="px-6 py-4">Name</th>
                    <th class="px-6 py-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="studentTableBody" class="divide-y divide-gray-100">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full">
        <h3 class="text-xl font-bold mb-6">Edit Student</h3>
        <input type="hidden" id="editStudentId">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Student Name</label>
            <input id="editStudentName" type="text" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-3 bg-gray-50 border">
        </div>
        <div class="flex justify-end space-x-3">
            <button onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancel</button>
            <button onclick="saveStudent()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">Save Changes</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadStudents);

    function loadStudents() {
        fetch('/students')
            .then(res => res.json())
            .then(students => {
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = students.map(s => `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 text-gray-600">#${s.id}</td>
                        <td class="px-6 py-4 font-medium text-gray-800">${s.name}</td>
                        <td class="px-6 py-4 text-right space-x-2">
                            <button onclick="editStudent(${s.id}, '${s.name}')" class="text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg transition">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteStudent(${s.id})" class="text-red-600 hover:bg-red-50 p-2 rounded-lg transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
                if (students.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-gray-500">No students found. Add your first student!</td></tr>';
                }
            });
    }

    function editStudent(id, name) {
        document.getElementById('editStudentId').value = id;
        document.getElementById('editStudentName').value = name;
        document.getElementById('editModal').classList.remove('hidden');
        document.getElementById('editModal').classList.add('flex');
    }

    function closeModal() {
        document.getElementById('editModal').classList.add('hidden');
        document.getElementById('editModal').classList.remove('flex');
    }

    function saveStudent() {
        const id = document.getElementById('editStudentId').value;
        const name = document.getElementById('editStudentName').value;
        fetch(\`/update_student/\${id}\`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        }).then(res => res.json()).then(data => {
            showToast(data.message);
            closeModal();
            loadStudents();
        });
    }

    function deleteStudent(id) {
        if (confirm('Are you sure you want to delete this student and all their records?')) {
            fetch(\`/delete_student/\${id}\`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    showToast(data.message);
                    loadStudents();
                });
        }
    }

    function openAddModal() {
        // Just redirect to dashboard or show a modal? 
        // Let's redirect to dashboard for simplicity as it has the register form
        location.href = '/';
    }
</script>
{% endblock %}
